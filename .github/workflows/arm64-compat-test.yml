name: Check Android 16 page-size compatibility mode
on:
  push:
    branches: [fix/arm64-startup]
    paths: ['.github/workflows/arm64-compat-test.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 36, image: google_apis_ps16k, arch: x86_64, pages: 16384}
    timeout-minutes: 32
    steps:
      - name: Run the 64-bit APK and collect application diagnostics
        shell: bash
        env:
          EXPECTED_PAGES: ${{ matrix.pages }}
          API: ${{ matrix.api }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          src="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA"
          curl -fsSL --retry 3 "$src/qa/arm-hardware/observe.py" -o observe.py
          curl -fsSL --retry 3 "$src/qa/v53-entry/full_check.py" -o full_check.py
          dl="https://github.com/$GITHUB_REPOSITORY/releases/download"
          curl -fsSL --retry 3 "$dl/client-v5.3-textures/RUSSIA_v5.3.apk" -o client.apk &
          apkpid=$!
          curl -fsSL --retry 3 "$dl/client-v5-play-1cdd9c76725fdd1ab07f196a9e5fdcafd5c58/Rkkdev.zip" -o cache.zip &
          zpid=$!
          export ANDROID_AVD_HOME="$RUNNER_TEMP/test-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          pkg="system-images;android-$API;$IMAGE;$ARCH"
          "$sdk/sdkmanager" "$pkg" emulator platform-tools >sdk.log
          echo no | "$sdk/avdmanager" create avd --force -n diag -k "$pkg" --device pixel_4
          sed -i '/^disk.dataPartition.size=/d;/^hw.lcd./d' "$ANDROID_AVD_HOME/diag.avd/config.ini"
          echo 'disk.dataPartition.size=10000M' >> "$ANDROID_AVD_HOME/diag.avd/config.ini"
          echo 'hw.lcd.width=720' >> "$ANDROID_AVD_HOME/diag.avd/config.ini"
          echo 'hw.lcd.height=1280' >> "$ANDROID_AVD_HOME/diag.avd/config.ini"
          echo 'hw.lcd.density=240' >> "$ANDROID_AVD_HOME/diag.avd/config.ini"
          sudo apt-get -qq update
          sudo apt-get -qq install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0 libglu1-mesa tesseract-ocr-rus
          accel=on
          if [[ "$ARCH" == arm64-v8a ]]; then export ANDROID_I_WANT_MY_TCG=yes; accel=off; else sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
          adb start-server
          emulator -avd diag -accel "$accel" -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -feature -Vulkan -camera-back none -camera-front none -memory 3072 -cores 4 -partition-size 10000 >emu.log 2>&1 &
          ep=$!
          trap 'tail -18 emu.log; adb emu kill >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 96); do
            kill -0 "$ep" || { tail -65 emu.log; exit 1; }
            if [[ "$(timeout 4 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then break; fi
            sleep 3
          done
          test "$(timeout 8 adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          pages=$(adb shell getconf PAGE_SIZE | tr -d '\r')
          echo "Android test environment uses $pages-byte pages"
          test "$pages" = "$EXPECTED_PAGES"
          abi=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')
          echo "Android $API reports $abi"
          [[ "$abi" == *arm64-v8a* ]]
          wait "$apkpid"
          wait "$zpid"
          echo 'e6d99119e011d02ef51590405db3b8c5627c213c4a62f57b9b2f8eeb824c2f1d  client.apk' | sha256sum -c
          adb shell wm dismiss-keyguard || true
          curl -fsSL --retry 3 "$src/android/v54/client.zst.b64" -o client.zst.b64
          base64 -d client.zst.b64 > delta.zst
          zstd -dq --long=27 --patch-from=client.apk delta.zst -o candidate.apk
          curl -fsSL --retry 3 "$src/android/v54/SHA256SUMS" -o SHA256SUMS
          sha256sum -c SHA256SUMS
          adb root
          adb wait-for-device
          adb shell setprop bionic.linker.16kb.app_compat.enabled true
          adb shell setprop pm.16kb.app_compat.disabled false
          adb install -g --abi arm64-v8a candidate.apk
          adb shell dumpsys package com.wn.blackrussia | grep -m 1 primaryCpuAbi
          if [[ "$API" -ge 30 ]]; then adb shell appops set com.wn.blackrussia MANAGE_EXTERNAL_STORAGE allow; fi
          result=0
          # This Google system image presents an OS-owned full-screen tutorial on first use.
          adb shell settings put secure immersive_mode_confirmations confirmed
          python3 -u observe.py || result=$?
          adb logcat -d -s AXL:* NVEvent:* AndroidRuntime:E DEBUG:F libc:F > game.log
          grep -iE 'signal |failed to|backtrace|libGame.so|libmultiplayer.so|ndk_translation|opcode|instruction|unsupported|file not found|database|load(ing)? |texture|critical|assert|error|CPU feature' game.log | grep -viE 'passw|bearer|token|https?:|login|account|settings.ini' | tail -105 || true
          adb logcat -d -b all | grep -iE 'illegal instruction|unsupported (instruction|opcode)|unimplemented instruction|intrinsic|native bridge.*failed|SIGILL|FORTIFY|ubsan|unimplemented syscall' | tail -32 || true
          exit "$result"
