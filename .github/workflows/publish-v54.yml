name: Publish verified RUSSIA v5.4 package
on:
  push:
    branches: [fix/arm64-startup]
    paths: ['.github/workflows/publish-v54.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: client-v5.4-arm64-cache
    steps:
      - name: Verify the package and attach it to the release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          src="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/android/v54"
          dl="https://github.com/$GITHUB_REPOSITORY/releases/download"
          curl -fsSL --retry 3 "$dl/client-v5.3-textures/RUSSIA_v5.3.apk" -o base.apk
          echo 'e6d99119e011d02ef51590405db3b8c5627c213c4a62f57b9b2f8eeb824c2f1d  base.apk' | sha256sum -c
          for file in client.zst.b64 SHA256SUMS release.md; do curl -fsSL --retry 3 "$src/$file" -o "$file"; done
          base64 -d client.zst.b64 > client.zst
          zstd -dq --long=27 --patch-from=base.apk client.zst -o candidate.apk
          sha256sum -c SHA256SUMS
          sdk=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -1)
          "$sdk/zipalign" -c -P 16 4 candidate.apk
          "$sdk/apksigner" verify --verbose --print-certs candidate.apk
          mv candidate.apk RUSSIA_v5.4.apk
          expected=$(cut -d' ' -f1 SHA256SUMS)
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" RUSSIA_v5.4.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "RUSSIA v5.4 — исправления кэша для ARM64" --prerelease --notes-file release.md
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[]|select(.name=="RUSSIA_v5.4.apk")|.digest' | grep -Fx "sha256:$expected"
