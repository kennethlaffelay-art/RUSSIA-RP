name: Winter 1.7.31 ARM gameplay and offline cache
on:
  push:
    branches: [feature/winter-1.7.31]
    paths: ['winter/2027/**', '.github/workflows/edition31-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        edition: [edition30-control, edition31]
    steps:
      - uses: actions/checkout@v4
      - name: Run identical camera route with isolated QA signature
        env:
          EDITION: ${{ matrix.edition }}
        run: bash winter/2027/qa/android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.edition }}-android-evidence
          path: ${{ runner.temp }}/winter/evidence/
      - name: Preserve the exact unsigned input of the successful ARM test
        if: success() && matrix.edition == 'edition31'
        uses: actions/upload-artifact@v4
        with:
          name: RUSSIA-RP-1.7.31-unsigned-for-signing
          path: ${{ runner.temp }}/winter/unsigned.apk
          if-no-files-found: error
