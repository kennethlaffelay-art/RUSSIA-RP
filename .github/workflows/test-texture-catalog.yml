name: Verify game entry with the cache texture catalog
on:
  push:
    branches: [qa/v52-texture-catalog]
    paths: ['.github/workflows/test-texture-catalog.yml']
permissions:
  contents: read
jobs:
  entry:
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh]
    env:
      SCENARIO: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Test a fresh Android installation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avds"
          mkdir -p "$ANDROID_AVD_HOME"
          "$sdk/sdkmanager" "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64" >android-sdk.log
          echo no | "$sdk/avdmanager" create avd --force -n playtest -k "system-images;android-30;google_apis;x86_64" --device pixel_4
          sed -i '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/playtest.avd/config.ini"
          echo 'disk.dataPartition.size=14000M' >>"$ANDROID_AVD_HOME/playtest.avd/config.ini"
          sudo apt-get -qq update
          sudo apt-get -qq install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0 libglu1-mesa tesseract-ocr tesseract-ocr-rus
          df -h "$RUNNER_TEMP"
          emulator -list-avds
          emulator -accel-check
          adb start-server
          emulator -avd playtest -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -feature -Vulkan -camera-back none -camera-front none -memory 4096 -partition-size 14000 >emulator.log 2>&1 &
          emupid=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; tail -35 emulator.log' EXIT
          ready=0
          for attempt in $(seq 1 100); do
            if ! kill -0 "$emupid" 2>/dev/null; then tail -70 emulator.log; exit 1; fi
            if [[ "$(timeout 4 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          adb shell wm dismiss-keyguard
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell df -k /data
          avail=$(adb shell df -k /data | awk 'NR==2 {print $4}')
          test "$avail" -gt 6500000
          adb shell getprop ro.product.cpu.abilist
          src="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/android/v52"
          for file in full_check.py samples.json dex_edits.py patch_base.py client-v52.patch; do
            curl -fsSL --retry 3 "$src/$file" -o "$file"
          done
          curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/client-v5.1-play/RUSSIA_v5.1.apk" -o base.apk
          echo 'f972693f64f5941a496ef00509075bcc6fa5375b7f4dee36fe120cff71c28ba6  base.apk' | sha256sum -c
          python3 patch_base.py base.apk RUSSIA_v5.2.apk
          git apply --binary client-v52.patch
          echo '218ead3333e5caaff5d9abd5756b704e27f11eae451ac516c4d0a57c7719c0a1  RUSSIA_v5.2.apk' | sha256sum -c
          abi=arm64-v8a

          echo "Testing game ABI $abi"
          adb install -g --abi "$abi" base.apk
          adb install -r -g --abi "$abi" RUSSIA_v5.2.apk
          adb shell appops set com.wn.blackrussia MANAGE_EXTERNAL_STORAGE allow
          # Stage only the texture names present in this exact APK's cache manifest.
          python3 - <<'PY'
          import re
          from pathlib import Path
          from zipfile import ZipFile

          with ZipFile("RUSSIA_v5.2.apk") as apk:
              names = {line.split("\t")[0] for line in apk.read("assets/russia-cache-v52.tsv").decode().splitlines()}
          catalogs = sorted(name.split("/")[1] for name in names if re.fullmatch(r"texdb/([^/]+)/\1\.txt", name))
          assert {"mobile", "txd", "gta3", "samp"}.issubset(catalogs)
          Path("texdbs.cfg").write_text("\n".join(catalogs) + "\n", encoding="ascii")
          print("Verified texture catalogs:", catalogs)
          PY
          adb shell mkdir -p /sdcard/Weik/loader
          adb push texdbs.cfg /sdcard/Weik/loader/texdbs.cfg
          if ! python3 -u full_check.py; then
            adb logcat -d -v brief -s AXL | grep -iE 'loading texture|texture database|file not found|texture .{0,80}not found|CFont|TextureDatabaseRuntime|initiali.e|\.so \+' | grep -viE 'password|token|/data/app|login|nickname|server address' | tail -45 || true
            exit 1
          fi
