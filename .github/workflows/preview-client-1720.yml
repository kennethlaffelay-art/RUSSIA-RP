name: Publish Moscow inventory preview
on:
  push:
    branches: [release/moscow-client-1.7.20]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'kennethlaffelay-art/RUSSIA-RP'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Rebuild the signed update from the previous preview
        env:
          BASE_DIR: android/russia-rp/inventory/1.7.20
        run: |
          set -euo pipefail
          source="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$BASE_DIR"
          for file in hook.py rebuild-dex.py dictionary-build.py client.zst inventory-preview.jpg hud-preview.png; do
            curl -fsSL --retry 3 "$source/$file" -o "$file"
          done
          curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/russia-rp-v1.7.19-preview/RUSSIA-RP-1.7.19.apk" -o previous.apk
          curl -fsSL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          echo '9133b446d86ef7e38d32c73a9b75d2f809259162973abbd9cace088738425768  previous.apk' | sha256sum -c -
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  apktool.jar' | sha256sum -c -
          python3 rebuild-dex.py previous.apk apktool.jar classes3.dex
          python3 dictionary-build.py previous.apk classes3.dex dictionary
          zstd -dq --long=27 --patch-from=dictionary client.zst -o RUSSIA-RP-1.7.20.apk
          echo 'f8269ad0a5cafdb99203b4cef07718cfba764641823269f5d622dfd535ee4613  RUSSIA-RP-1.7.20.apk' | sha256sum -c -
      - name: Publish the signed preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=russia-rp-v1.7.20-preview
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" | jq -e '.prerelease and any(.assets[]; .name=="RUSSIA-RP-1.7.20.apk" and .digest=="sha256:f8269ad0a5cafdb99203b4cef07718cfba764641823269f5d622dfd535ee4613")'
            exit
          fi
          gh release create "$tag" RUSSIA-RP-1.7.20.apk inventory-preview.jpg hud-preview.png --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "RUSSIA RP 1.7.20 — инвентарь «Москвы»" --notes "Тестовая сборка для Android. Откройте Меню → Инвентарь или введите /inv. Новый рюкзак, экипировка, VIP-ячейки быстрого доступа и обновлённый логотип сервера в игре. APK устанавливается поверх подписанного клиента 1.7.19. Интерфейс рюкзака на иллюстрации показан с примером наполнения."
