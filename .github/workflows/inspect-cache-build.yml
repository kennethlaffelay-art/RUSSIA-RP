name: Inspect the v5.7 client for the cache repair build
on:
  push:
    branches: [release/v59-cache-repair]
    paths: ['.github/workflows/inspect-cache-build.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check Android manifest, dex and game configuration
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/client-v5.7-game-surface/RUSSIA_v5.7.apk" -o base.apk
          echo '6fb0fb4cf7687e7c9687c097bde162432803c36543f365a720e8a015aefb1463  base.apk' | sha256sum -c
          sdk=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -1)
          "$sdk/aapt" dump badging base.apk | grep -E '^(package|sdkVersion|targetSdkVersion|launchable-activity|native-code)'
          "$sdk/aapt" dump xmltree base.apk AndroidManifest.xml | grep -E 'package=|android:(name|authorities|targetPackage|permission|scheme|host)|E: (provider|application)' | head -240 || true
          unzip -p base.apk classes8.dex > cache.dex
          "$sdk/dexdump" cache.dex | grep -E 'Class descriptor|setProgress' | head -75
          unzip -Z1 base.apk | grep -Ei 'server|samp\.ini|settings\.ini|netconfig|endpoint|client.*json|/lib(Game|multiplayer|samp)\.so' | head -100 || true
          python3 - <<'PY'
          from zipfile import ZipFile
          import re,collections
          with ZipFile('base.apk') as z:
              for n in z.namelist():
                  if not (n.endswith('.dex') or ('arm64-v8a' in n and n.endswith(('/libmultiplayer.so','/libGame.so','/libsamp.so')))):continue
                  raw=z.read(n)
                  ips=sorted(set(v.decode() for v in re.findall(rb'(?<![0-9.])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?::[0-9]{2,5})?(?![0-9.])',raw) if all(int(a)<=255 for a in v.split(b':')[0].split(b'.'))))
                  print(n, 'IPv4 literals:',ips[:70])
                  if 'libmultiplayer.so' in n:
                      print('Config names:', [s[:100].decode('ascii','replace') for s in re.findall(rb'[ -~]{5,}', raw) if any(w in s.lower() for w in (b'.ini',b'server_ip',b'serverport',b'lastserver',b'server.ip'))][:50])
          PY
