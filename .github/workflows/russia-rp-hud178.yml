name: RUSSIA RP HUD
on:
  push:
    branches: [work/android-1.7.8-hud, work/android-1.7.9-hud]
    paths:
      - 'android/russia-rp/branding/v178/**'
      - '.github/workflows/russia-rp-hud178.yml'
permissions:
  contents: read
env:
  HUD_VERSION: ${{ github.ref_name == 'work/android-1.7.9-hud' && '1.7.9' || '1.7.8' }}
  HUD_CODE: ${{ github.ref_name == 'work/android-1.7.9-hud' && '33' || '32' }}
  HUD_APP: ${{ github.ref_name == 'work/android-1.7.9-hud' && 'com.russiarp.hud2' || 'com.russiarp.hudx' }}
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the standalone HUD and comparison fixtures
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          api="$ANDROID_HOME/platforms/android-35/android.jar"
          sources="$GITHUB_WORKSPACE/android/russia-rp/branding"
          cd "$RUNNER_TEMP"
          mkdir -p smoke classes dex
          curl -fLsS --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/russia-rp-v1.7.7-preview/RUSSIA-RP-1.7.7-test.apk" -o smoke/original.apk
          curl -fLsS --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  apktool.jar' | sha256sum -c
          python3 -m venv buildenv
          buildenv/bin/pip install Pillow==11.3.0
          flags=()
          if [[ "$HUD_VERSION" == 1.7.9 ]]; then flags+=(--large-emblem); fi
          buildenv/bin/python "$sources/v178/rebuild_178.py" --base smoke/original.apk --build-tools "$sdk" --apktool apktool.jar --standalone "${flags[@]}" --output hud.apk
          javac -source 8 -target 8 -bootclasspath "$api" -d classes "$sources/v176/qa/Screens.java" "$sources/v177/qa/PreviewScreens.java" "$sources/v178/qa/HudScreens.java"
          "$sdk/d8" --min-api 23 --lib "$api" --output dex classes/com/russiarp/qa/*.class
          keytool -genkeypair -alias hud -dname "CN=RUSSIA RP HUD preview" -keyalg RSA -keysize 3072 -validity 10000 -keystore hud.p12 -storepass preview-ci -keypass preview-ci
          sign() { "$sdk/apksigner" sign --ks hud.p12 --ks-pass pass:preview-ci --v4-signing-enabled false --out "$2" "$1"; }
          sign hud.apk smoke/RUSSIA-RP-${HUD_VERSION}-HUD.apk
          "$sdk/apksigner" verify --verbose --print-certs smoke/RUSSIA-RP-${HUD_VERSION}-HUD.apk
          "$sdk/aapt" dump badging smoke/RUSSIA-RP-${HUD_VERSION}-HUD.apk > package.txt
          grep -F "package: name='$HUD_APP' versionCode='$HUD_CODE' versionName='$HUD_VERSION'" package.txt
          sign smoke/original.apk smoke/baseline-qa.apk
          for variant in before after; do
            cp "$sources/v178/qa/AndroidManifest.xml" AndroidManifest.xml
            if test "$variant" = after; then
              sed -i -e s/com.russiarp.test/$HUD_APP/g -e s/com.russiarp.qa178/com.russiarp.qa178hud/g AndroidManifest.xml
            fi
            "$sdk/aapt2" link -I "$api" --manifest AndroidManifest.xml -o "$variant.apk"
            (cd dex && zip -q "../$variant.apk" classes.dex)
            "$sdk/zipalign" -f 4 "$variant.apk" "$variant-aligned.apk"
            sign "$variant-aligned.apk" "smoke/fixture-$variant.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-inputs
          path: ${{ runner.temp }}/smoke/*.apk
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: hud-for-signing
          path: ${{ runner.temp }}/hud.apk
          retention-days: 5
  android:
    needs: package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      ANDROID_SERIAL: 127.0.0.1:5555
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-inputs
          path: ${{ runner.temp }}/smoke
      - name: Measure the old and new HUD on Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y adb python3-pil
          if ! sudo modprobe binder_linux; then
            sudo apt-get -qq install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux
          fi
          docker run --name test-phone --privileged -d -p 127.0.0.1:5555:5555 redroid/redroid:12.0.0-latest androidboot.use_memfd=1 androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1280 androidboot.redroid_height=720
          for n in $(seq 1 90); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if test "$(timeout 3 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1; then break; fi
            sleep 2
          done
          adb shell getprop sys.boot_completed | grep -q 1
          cd "$RUNNER_TEMP/smoke"
          adb install -g baseline-qa.apk
          adb install -g RUSSIA-RP-${HUD_VERSION}-HUD.apk
          adb install fixture-before.apk
          adb install fixture-after.apk
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          for variant in before after; do
            if test "$variant" = before; then app=com.russiarp.test; fixture=com.russiarp.qa178; else app=$HUD_APP; fixture=com.russiarp.qa178hud; fi
            adb shell am instrument -w "$fixture/com.russiarp.qa.HudScreens" | tee "$variant.txt"
            grep -q 'HUD PASSED' "$variant.txt"
            mkdir -p "$RUNNER_TEMP/screenshots/$variant"
            for w in 1280 1600; do
              for f in "mark-$w.png" "qa176-$w-hud.jpg"; do
                docker exec test-phone cat "/data/data/$app/files/$f" > "$RUNNER_TEMP/screenshots/$variant/$f"
              done
            done
          done
          /usr/bin/python3 "$GITHUB_WORKSPACE/android/russia-rp/branding/v178/qa/compare.py" "$RUNNER_TEMP/screenshots" "$HUD_VERSION"
          adb uninstall com.russiarp.test
          adb install -g original.apk
          adb shell pm path com.russiarp.test
          adb shell pm path $HUD_APP
          adb shell am start -W -n $HUD_APP/blackrussia.online.activities.SplashActivity
          sleep 4
          adb shell pidof $HUD_APP
      - name: Start native gameplay with the reference cache
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 2 https://github.com/sunshineq1/cash-samp-russia/releases/download/v1.0/Weik.zip -o cache.zip
          echo '090aaaf02b2697e8a6945cf4e0a82aa28c459a85d426f7a3a038e0aa8871050b  cache.zip' | sha256sum -c
          unzip -q cache.zip
          unzip -q smoke/RUSSIA-RP-${HUD_VERSION}-HUD.apk 'assets/weik-defaults/*'
          cp -an assets/weik-defaults/. Weik/
          sed -i -E 's/^name[[:space:]]*=.*/name = Russia_Smoke/;s/^host[[:space:]]*=.*/host = 127.0.0.1/;s/^port[[:space:]]*=.*/port = 7777/' Weik/SAMP/settings.ini
          adb push Weik /sdcard/ >/dev/null
          adb shell appops set --uid $HUD_APP MANAGE_EXTERNAL_STORAGE allow
          adb logcat -c
          timeout 120 adb shell am instrument -w -e mode game com.russiarp.qa178hud/com.russiarp.qa.PreviewScreens > game.txt &
          instrument_pid=$!
          sleep 35
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' > foreground.txt || true
          cat foreground.txt
          adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
          adb logcat -d -s AXL AndroidRuntime DEBUG libc | tail -80
          adb logcat -b crash -d | tail -45
          adb shell 'if [ -f /sdcard/Weik/reBRClientLog.txt ]; then tail -22 /sdcard/Weik/reBRClientLog.txt; fi'
          wait "$instrument_pid"
          cat game.txt
          grep -Fq "$HUD_APP/com.wn.blackrussia.game.Multiplayer" foreground.txt
          grep -q 'GAME177 PASSED' game.txt
          adb logcat -b crash -d > crash.txt
          if grep -Fq "$HUD_APP" crash.txt; then cat crash.txt; exit 1; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-comparison
          path: ${{ runner.temp }}/screenshots/
