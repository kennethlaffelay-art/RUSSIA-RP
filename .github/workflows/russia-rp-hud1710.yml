name: RUSSIA RP 1.7.10 HUD
on:
  push:
    branches: [work/android-1.7.10-hud]
    paths:
      - 'android/russia-rp/branding/v1710/**'
      - '.github/workflows/russia-rp-hud1710.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build both UI test packages
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          api="$ANDROID_HOME/platforms/android-35/android.jar"
          src="$GITHUB_WORKSPACE/android/russia-rp/branding"
          cd "$RUNNER_TEMP"
          mkdir -p classes dex phones
          curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/russia-rp-v1.7.8-hud/RUSSIA-RP-1.7.8-HUD.apk" -o base.apk
          curl -fsSL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  apktool.jar' | sha256sum -c
          python3 -m venv buildenv
          buildenv/bin/pip install Pillow==11.3.0
          buildenv/bin/python "$src/v1710/rebuild_1710.py" --base base.apk --build-tools "$sdk" --apktool apktool.jar --output update.apk
          javac -source 8 -target 8 -bootclasspath "$api" -d classes "$src/v176/qa/Screens.java" "$src/v178/qa/HudScreens.java"
          "$sdk/d8" --min-api 23 --lib "$api" --output dex classes/com/russiarp/qa/*.class
          sed -e '/android:name="com.russiarp.qa.PreviewScreens"/d' -e 's/com.russiarp.test/com.russiarp.hudx/g' "$src/v178/qa/AndroidManifest.xml" > AndroidManifest.xml
          "$sdk/aapt2" link -I "$api" --manifest AndroidManifest.xml -o fixture.apk
          (cd dex && zip -q ../fixture.apk classes.dex)
          "$sdk/zipalign" -f 4 fixture.apk fixture-aligned.apk
          keytool -genkeypair -alias qa -dname "CN=HUD rendering test" -keyalg RSA -keystore qa.p12 -storepass fixture-ci -keypass fixture-ci
          sign() { "$sdk/apksigner" sign --ks qa.p12 --ks-pass pass:fixture-ci --v4-signing-enabled false --out "$2" "$1"; }
          sign base.apk phones/before.apk
          sign update.apk phones/after.apk
          sign fixture-aligned.apk phones/test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hud-qa-inputs
          path: ${{ runner.temp }}/phones/*.apk
          retention-days: 1
  render:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      ANDROID_SERIAL: 127.0.0.1:5555
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hud-qa-inputs
          path: ${{ runner.temp }}/phones
      - name: Measure the in-game layout before and after updating
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y adb python3-pil
          if ! sudo modprobe binder_linux; then
            sudo apt-get -qq install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux
          fi
          docker run --name phone --privileged -d -p 127.0.0.1:5555:5555 redroid/redroid:12.0.0-latest androidboot.use_memfd=1 androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1280 androidboot.redroid_height=720
          for n in $(seq 1 90); do
            adb connect "$ANDROID_SERIAL" >/dev/null || true
            if test "$(timeout 3 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1; then break; fi
            sleep 2
          done
          adb shell getprop sys.boot_completed | grep -q 1
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          cd "$RUNNER_TEMP"
          adb install phones/test.apk
          for version in before after; do
            adb install -r -g "phones/$version.apk"
            adb shell am instrument -w com.russiarp.qa178/com.russiarp.qa.HudScreens | tee render.log
            grep -q 'HUD PASSED' render.log
            mkdir -p "screens/$version"
            for w in 1280 1600; do
              for file in "mark-$w.png" "qa176-$w-hud.jpg"; do
                docker exec phone cat "/data/data/com.russiarp.hudx/files/$file" > "screens/$version/$file"
              done
            done
          done
          /usr/bin/python3 "$GITHUB_WORKSPACE/android/russia-rp/branding/v1710/qa/compare.py" screens
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-screenshots
          path: ${{ runner.temp }}/screens
          retention-days: 7
