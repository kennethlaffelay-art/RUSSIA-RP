name: Test client on native ARM64 Android
on:
  push:
    branches: [fix/arm64-startup]
    paths: ['.github/workflows/arm64-hardware.yml', 'qa/arm-hardware/**']
permissions: {}
jobs:
  native:
    env:
      ANDROID_SERIAL: 127.0.0.1:15555
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - {android: 12, image: 'redroid/redroid@sha256:3c7f9450188226bf8042c0159b9b38abe2106f1ceb0dfa45fae1cbc6409cd9bb'}
          - {android: 15, image: 'redroid/redroid@sha256:dc2024a999dd0acb1112a23cddc9537ec8cb60a0dbe5a87ce9fbd75a2f5e94d2'}
    name: Android ${{ matrix.android }} on ARM64
    steps:
      - name: Boot Android on native ARM processors
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          test "$(uname -m)" = aarch64
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          sudo apt-get -qq update
          sudo apt-get -qq install -y adb tesseract-ocr-rus
          docker run -d --name arm-android --platform linux/arm64 --privileged -p 127.0.0.1:15555:5555 -v android-data:/data "$IMAGE" androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest androidboot.redroid_width=720 androidboot.redroid_height=1280 androidboot.redroid_dpi=320
          adb start-server
          for i in $(seq 1 60); do
            adb connect 127.0.0.1:15555 > /dev/null 2>&1 || true
            if [[ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then break; fi
            sleep 3
          done
          docker ps -a --filter name=arm-android
          test "$(timeout 5 adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell uname -m
          adb shell getprop ro.dalvik.vm.native.bridge
          test "$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')" = arm64-v8a
      - name: Exercise the published APK through Play
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          src="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA"
          dl="https://github.com/$GITHUB_REPOSITORY/releases/download"
          curl -fsSL --retry 3 "$src/qa/arm-hardware/observe.py" -o observe.py
          curl -fsSL --retry 3 "$src/qa/v53-entry/full_check.py" -o full_check.py
          curl -fsSL --retry 3 "$dl/client-v5.3-textures/RUSSIA_v5.3.apk" -o client.apk
          echo 'e6d99119e011d02ef51590405db3b8c5627c213c4a62f57b9b2f8eeb824c2f1d  client.apk' | sha256sum -c
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb install -g --abi arm64-v8a client.apk
          adb shell dumpsys package com.wn.blackrussia | grep primaryCpuAbi
          adb shell appops set com.wn.blackrussia MANAGE_EXTERNAL_STORAGE allow
          curl -fsSL --retry 3 "$dl/client-v5-play-1cdd9c76725fdd1ab07f196a9e5fdcafd5c58/Rkkdev.zip" -o cache.zip
          python3 -u observe.py
      - name: Collect Android diagnostics
        if: always()
        run: |
          docker logs --tail=18 arm-android 2>&1 || true
          timeout 5 adb shell getprop init.svc.surfaceflinger || true
          timeout 5 adb logcat -d -b crash | grep -E 'signal |Abort message|Cause:|#[0-9]+ pc|ABI:' | grep -viE 'passw|token|bearer|https?://' | tail -65 || true
          timeout 8 adb logcat -d -s 'AXL:*' | grep -iE 'failed|init|texture|load|error|not found|models' | grep -viE 'passw|token|bearer|https?:|login|account|settings.ini' | tail -35 || true
          docker rm -f arm-android >/dev/null 2>&1 || true
